    scrapeTimeout: ""
    honorLabels: false
    metricRelabelings: []
    relabelings: []
    annotations: {}
    jobLabel: ""
    additionalLabels: {}
    podTargetLabels: []
    sampleLimit: false
    targetLimit: false
    additionalEndpoints: []

  podMonitor:
    enabled: false
    namespace: ""
    interval: ""
    scrapeTimeout: ""
    honorLabels: false
    metricRelabelings: []
    relabelings: []
    annotations: {}
    jobLabel: ""
    additionalLabels: {}
    podTargetLabels: []
