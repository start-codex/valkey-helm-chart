# Pre-upgrade hook: deletes the StatefulSets with --cascade=orphan so Helm recreates them.
# Only needed when a new chart version changes a StatefulSet field Kubernetes does not allow
# to update in place (serviceName, selector, volumeClaimTemplates, podManagementPolicy);
# otherwise the upgrade fails with "Forbidden: updates to statefulset spec".
# volumeClaimTemplates used to carry the helm.sh/chart and app.kubernetes.io/version labels,
# so every version bump changed an immutable field and every upgrade needed this hook. They
# now use the stable selector labels, so nothing immutable changes between versions and the
# hook is disabled by default. That matters beyond convenience: the hook deletes all three
# StatefulSets at once, restarting the sentinels together with the data pods, and an upgrade
# can end with no master at all. When enabled, the upgrade also depends on pulling the hook
# image and stays in pending-upgrade if it cannot.
preUpgradeHook:
  enabled: false
  image:
    registry: cgr.dev
    repository: chainguard/kubectl
    tag: "latest"
    pullPolicy: IfNotPresent

  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Init containers for volume permissions
volumePermissions:
  enabled: false
  image:
    registry: cgr.dev
    repository: chainguard/wolfi-base
    tag: "latest"
    pullPolicy: IfNotPresent

  containerSecurityContext:
    enabled: true
    capabilities:
      drop:
      - ALL
      add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    runAsUser: 0

  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Sysctls configuration
sysctls:
  enabled: false

# Additional configuration options
existingConfigmap: ""

# Extra environment variables
extraEnvVars: []

# Extra volumes
extraVolumes: []

# Extra volume mounts
extraVolumeMounts: []

# TLS Configuration
tls:
  enabled: false
  port: 6380
  existingSecret: ""
  certFilename: "tls.crt"
  certKeyFilename: "tls.key"
  caCertFilename: "ca.crt"
  authClients: true

# Extra resources to deploy
extraDeploy: []

# External service configuration (can be configured via service type)
# Use standalone.service.type: LoadBalancer for external access

# Service Binding configuration
serviceBinding:
  enabled: false

# Headless service configuration
headlessService:
  annotations: {}
  extraPorts: []

# Pod Security Policy
podSecurityPolicy:
  enabled: false

# Diagnostic mode
diagnosticMode:
  enabled: false

