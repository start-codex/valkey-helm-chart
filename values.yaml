# Valkey Helm Chart - Minimal Configuration

# Deployment mode: standalone or sentinel
architecture: standalone

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Cluster domain for service discovery
clusterDomain: cluster.local

# Valkey image configuration
# Using Chainguard images for zero CVE security
#
# Why 'latest' tag?
# - Chainguard free tier only provides 'latest' tag
# - Ensures automatic security updates and zero known CVEs
# - appVersion in Chart.yaml tracks the actual version (auto-updated weekly)
#
# For production with version pinning, override with:
#   image:
#     repository: valkey/valkey  # Official Valkey registry
#     tag: "9.0.0"               # Specific version
image:
  registry: cgr.dev
  repository: chainguard/valkey
  tag: "latest"  # Auto-updated by Chainguard, version tracked in Chart.yaml appVersion
  pullPolicy: IfNotPresent

# Common configuration
nameOverride: ""
fullnameOverride: ""

# Authentication configuration
auth:
  enabled: false
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: "password"
  sentinel: false

# Network Policy
networkPolicy:
  enabled: false
  allowExternal: true
  ingressNSMatchLabels: {}
  ingressNSPodMatchLabels: {}

# RBAC configuration
rbac:
  create: false

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod Security Context
# Chainguard images run as user 65532
podSecurityContext:
  fsGroup: 65532
  runAsUser: 65532
  runAsGroup: 65532

# Security Context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

# Common annotations and labels
commonAnnotations: {}
commonLabels: {}

# Standalone Configuration
standalone:
  replicaCount: 1

  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
    annotations: {}

  service:
    type: ClusterIP
    port: 6379
    targetPort: valkey
    annotations: {}

  configuration: |-
    # Valkey configuration
    bind 0.0.0.0
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300

    # Memory configuration
    maxmemory-policy allkeys-lru

    # Persistence
    save 900 1
    save 300 10
    save 60 10000

    # Logging
    loglevel notice

    # Security
    protected-mode no

# Sentinel Configuration
sentinel:
  enabled: false
  replicaCount: 3
  quorum: 2
  masterSet: mymaster
  downAfterMilliseconds: 30000
  # Pods get a new IP on every restart, and Sentinel keeps the old address as an
  # s_down replica forever. With parallel-syncs 1 the failover leader can spend its
  # only reconfiguration slot on one of those dead addresses; the per-replica timeout
  # is only evaluated while a slot is free, so the failover then lasts the whole
  # failover-timeout, during which the leader still reports the old master in
  # SENTINEL MASTERS. Keep parallelSyncs above the number of stale entries and
  # failoverTimeout short.
  failoverTimeout: 30000
  parallelSyncs: 10

  # Sentinel uses the same Chainguard Valkey image (includes sentinel binary)
  # See main image configuration above for versioning strategy
  image:
    registry: cgr.dev
    repository: chainguard/valkey
    tag: "latest"  # Matches main Valkey image tag
    pullPolicy: IfNotPresent

  serviceAccount:
    create: false
    annotations: {}
    name: ""
    automountServiceAccountToken: true

  podSecurityContext:
    enabled: true
    fsGroup: 65532
    runAsUser: 65532
    runAsGroup: 65532

  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532

  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Covers the startup script, which may wait for a reachable master before
  # launching the server. Liveness and readiness only start after it succeeds,
  # so the wait is not killed. Default window: 5s x 60 = 5 minutes.
  startupProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 60

  livenessProbe:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 5

  readinessProbe:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 5

  service:
    type: ClusterIP
    port: 26379
    clusterIP: ""
    nodePort: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    annotations: {}
    sessionAffinity: None
    sessionAffinityConfig: {}
    internalTrafficPolicy: Cluster
    externalTrafficPolicy: Cluster
    extraPorts: []
    nodePorts:
      sentinel: ""
      sentinelTls: ""

  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  terminationGracePeriodSeconds: 30

  podAnnotations: {}
  extraEnvVars: []
  extraEnvVarsCM: ""
  extraEnvVarsSecret: ""
  extraVolumes: []
  extraVolumeMounts: []
  initContainers: []
  sidecars: []

  configuration: |-
    # Valkey Sentinel configuration
    port 26379
    dir /tmp

# Master configuration for sentinel mode
master:
