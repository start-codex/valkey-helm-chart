{{- if (include "valkey.createConfigmap" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-health" (include "valkey.fullname" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- /* Stable labels only: see the note in configmap.yaml. This file is
           hashed into checksum/health. */}}
    {{- include "valkey.selectorLabels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  ping_readiness_local.sh: |-
    #!/usr/bin/bash
    [[ -n "$VALKEY_PASSWORD" ]] && export REDISCLI_AUTH="$VALKEY_PASSWORD"
    response=$(valkey-cli -h localhost -p {{ if .Values.tls.enabled }}{{ .Values.tls.port | default 6380 }}{{ else }}6379{{ end }} ping 2>&1)
    if [ "$response" != "PONG" ]; then
      echo "$response"
      exit 1
    fi
  ping_liveness_local.sh: |-
    #!/usr/bin/bash
    [[ -n "$VALKEY_PASSWORD" ]] && export REDISCLI_AUTH="$VALKEY_PASSWORD"
    response=$(valkey-cli -h localhost -p {{ if .Values.tls.enabled }}{{ .Values.tls.port | default 6380 }}{{ else }}6379{{ end }} ping 2>&1)
    if [ "$response" = "PONG" ] || [[ "$response" == LOADING* ]] || [[ "$response" == MASTERDOWN* ]]; then
      exit 0
    fi
    echo "$response"
    exit 1
{{- if eq .Values.architecture "sentinel" }}
  ping_liveness_replica.sh: |-
    #!/usr/bin/bash
    # Local liveness first, as for any pod.
    "${0%/*}/ping_liveness_local.sh" || exit 1
    # A replica whose master disappeared after the sentinels lost track of it (for
    # example, sentinels recreated with a clean config during an upgrade) keeps
    # replicating a dead address forever: the sentinels only learn replicas from the
    # current master, so nobody reconfigures it. Fail only when the link is down and
    # the sentinels report a different master that answers as master; the pod then
    # restarts and discovers the current master on startup.
    port={{ include "valkey.port" . }}
    role="" host="" link=""
    while IFS=: read -r key value; do
      value=${value%$'\r'}
      case "$key" in
        role) role=$value ;;
        master_host) host=$value ;;
        master_link_status) link=$value ;;
      esac
    done < <(REDISCLI_AUTH="${VALKEY_PASSWORD:-}" valkey-cli -h localhost -p "$port" --no-auth-warning INFO replication 2>/dev/null)
    [[ "$role" == "slave" && "$link" == "down" ]] || exit 0
    reported=$(
      unset VALKEYCLI_AUTH REDISCLI_AUTH
      {{- if .Values.auth.sentinel }}
      export VALKEYCLI_AUTH="${VALKEY_PASSWORD:-}"
      {{- end }}
      valkey-cli -h {{ include "valkey.sentinel.serviceName" . | quote }} -p {{ .Values.sentinel.service.port | default 26379 | quote }} -t 1 --no-auth-warning \
        SENTINEL get-master-addr-by-name {{ .Values.sentinel.masterSet | quote }} 2>/dev/null
    )
    reported=${reported%%$'\n'*}
    [[ -n "$reported" && "$reported" != "$host" ]] || exit 0
    answer=$(REDISCLI_AUTH="${VALKEY_PASSWORD:-}" valkey-cli -h "$reported" -p "$port" -t 1 --no-auth-warning ROLE 2>/dev/null)
    [[ "${answer%%$'\n'*}" == "master" ]] || exit 0
    echo "Replicating unreachable master $host while the sentinels report master $reported"
    exit 1
  ping_sentinel.sh: |-
    #!/usr/bin/bash
{{- if .Values.auth.sentinel }}
    [[ -f $VALKEY_PASSWORD_FILE ]] && export VALKEY_PASSWORD="$(< "${VALKEY_PASSWORD_FILE}")"
    [[ -n "$VALKEY_PASSWORD" ]] && export VALKEYCLI_AUTH="$VALKEY_PASSWORD"
{{- end }}
    # A Service named valkey-sentinel makes Kubernetes set VALKEY_SENTINEL_PORT
    # to a tcp:// URL (enableServiceLinks defaults to true). The chart publishes
    # the numeric port as VALKEY_SENTINEL_PORT_NUMBER.
    SENTINEL_PORT=${VALKEY_SENTINEL_PORT_NUMBER:-26379}
    response=$(valkey-cli -h localhost -p $SENTINEL_PORT ping 2>&1)
    if [ "$response" != "PONG" ]; then
      echo "$response"
      exit 1
    fi
  ping_readiness_master.sh: |-
    #!/usr/bin/bash
    [[ -f $VALKEY_MASTER_PASSWORD_FILE ]] && export VALKEY_MASTER_PASSWORD="$(< "${VALKEY_MASTER_PASSWORD_FILE}")"
    [[ -n "$VALKEY_MASTER_PASSWORD" ]] && export VALKEYCLI_AUTH="$VALKEY_MASTER_PASSWORD"
    response=$(valkey-cli -h $VALKEY_MASTER_HOST -p $VALKEY_MASTER_PORT_NUMBER ping 2>&1)
    if [ "$response" != "PONG" ]; then
      echo "$response"
      exit 1
    fi
  ping_liveness_master.sh: |-
    #!/usr/bin/bash
    [[ -f $VALKEY_MASTER_PASSWORD_FILE ]] && export VALKEY_MASTER_PASSWORD="$(< "${VALKEY_MASTER_PASSWORD_FILE}")"
    [[ -n "$VALKEY_MASTER_PASSWORD" ]] && export VALKEYCLI_AUTH="$VALKEY_MASTER_PASSWORD"
    response=$(valkey-cli -h $VALKEY_MASTER_HOST -p $VALKEY_MASTER_PORT_NUMBER ping 2>&1)
    if [ "$response" = "PONG" ] || [[ "$response" == LOADING* ]]; then
      exit 0
    fi
    echo "$response"
    exit 1
  ping_readiness_local_and_master.sh: |-
    #!/usr/bin/bash
    script_dir="$(dirname "$0")"
    exit_status=0
    "$script_dir/ping_readiness_local.sh" || exit_status=$?
    "$script_dir/ping_readiness_master.sh" || exit_status=$?
    exit $exit_status
  ping_liveness_local_and_master.sh: |-
    #!/usr/bin/bash
    script_dir="$(dirname "$0")"
    exit_status=0
    "$script_dir/ping_liveness_local.sh" || exit_status=$?
    "$script_dir/ping_liveness_master.sh" || exit_status=$?
    exit $exit_status
{{- end }}
{{- end }}
