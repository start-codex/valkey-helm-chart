apiVersion: v2
name: valkey
description: Valkey is an open source, high-performance data structure server compatible with Redis. It supports strings, hashes, lists, sets, and sorted sets.
type: application
version: 0.3.6
appVersion: "9.1.2"
annotations:
  artifacthub.io/signKey: |
    fingerprint: 35D9AD8B98D2FB5AF685CABA019335D0A0561140
    url: https://start-codex.github.io/valkey-helm-chart/public-key.asc
  artifacthub.io/category: database
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Valkey Official
      url: https://valkey.io/
    - name: Chart Source
      url: https://github.com/start-codex/valkey-helm-chart
  artifacthub.io/images: |
    - name: valkey
      image: cgr.dev/chainguard/valkey:latest
    - name: wolfi-base
      image: cgr.dev/chainguard/wolfi-base:latest
    - name: redis-exporter
      image: docker.io/oliver006/redis_exporter:v1.93.0
    - name: kubectl
      image: cgr.dev/chainguard/kubectl:latest
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/prerelease: "false"
